name: Local regression

on:
  pull_request:
  push:
    branches: [master, main, 'codex/**']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_ENV: test
      GCLOUD_PROJECT: demo-training-coach
      VITE_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix web
      - run: python -m pip install -r functions/requirements.txt
      - run: npm install --global firebase-tools@15.13.0
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-regression-failure
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

# No cloud deployment, cloud regression, real email, or paid model calls run here.
